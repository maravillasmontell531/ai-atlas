name: Validate AI Atlas catalog
on:
  push:
    paths: ['data/**','scripts/validate_catalog.py','.github/workflows/validate-catalog.yml']
  pull_request:
    paths: ['data/**','scripts/validate_catalog.py','.github/workflows/validate-catalog.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate registry
        run: python scripts/validate_catalog.py
